; =====================================================================================================
;  Dishonored 2 VR - settings
; =====================================================================================================
;  Edit with Notepad, save, and restart the game: settings are read when the game starts.
;  A line starting with ; is a comment. Delete a line (or this whole file) to get the default back.
;  1 = on, 0 = off.
; =====================================================================================================

[Controls]
; Turning with the right stick: smooth or snap
TurnMode = smooth
; Smooth turning speed at full stick, in degrees per second (30 - 360)
SmoothTurnSpeed = 120
; Snap turning step, in degrees (10 - 90)
SnapTurnAngle = 45
; How long Y / X are held to use quick slot 3 / 4 instead of 1 / 2, in seconds (0.15 - 2)
QuickSlotHoldTime = 0.5
; Button layout: default = the layout in README.txt.
;                classic = Y leans, X interacts, menu button pauses (held: journal)
Layout = default
; Controller vibration
Haptics = 1
; If your in-game hands and weapons point higher or lower than your real controllers (some
; controllers report their pointing direction at another angle than Quest controllers do),
; tilt them here, in degrees: positive = up, negative = down (-60 - 60)
ControllerPitchOffset = 0
; The controllers only reach the game while it is the window in front on your PC. 1 = when you use a controller (or
; put the headset on) while another window is in front, the game is brought back to the front, and the pause it opened
; on its own is closed. 0 = never touch the windows (if you use your PC desktop from inside the headset)
FocusGameWindow = 1

[Gameplay]
; Swing the sword with your arm to strike (the right trigger always works too)
SwordGestures = 1
; Throw grenades and springrazors with your hand's motion
ThrowGestures = 1
; Grab and carry objects with the right grip, pointing at them
GrabObjects = 1

[Display]
; Aiming reticles on your hands
Reticle = 0
; Red world-aiming point for the left controller, projected separately into each eye
AimDot = 1
; Health, mana and the equipped item as a watch on the back of your LEFT wrist: turn the back of
; the wrist towards you and look at it. While it is on, the game's HUD is kept always visible
; (its "contextual" option would hide it); your own setting comes back when you turn it off.
WristHud = 1
; In stereo, lift the game's 2D HUD (including the crosshair and markers) onto one fused quad 2.4 m ahead.
; Set to 0 to leave it in the game's per-eye screen-space image.
StereoHud = 1
; Width of that HUD panel in your view (degrees, 35 - 90). Smaller values pull edge notifications inward.
StereoHudWidth = 60
; Size of the watch, in centimetres (4 - 15)
WristHudSize = 8.5
; Turns the game's camera motion blur off (it causes discomfort in VR). The game remembers this
; setting afterwards, as if you had changed it in its own options.
DisableMotionBlur = 1
; Meta headsets (Link / Air Link) only: turns Meta's ASW off for this game. When the game runs below
; the headset's refresh, ASW invents the missing frames and the edges of moving hands and of the
; world on fast head turns come out warped. Off, the last picture is turned with your head: clean.
; 0 = leave ASW as Meta has it. Other headsets' apps are not touched (see the README).
DisableMetaASW = 1
; 3D. 0 = off: both eyes see the same picture (smoothest). 1 = real depth: the game draws the
; world twice from the same instant, once for each eye, so it runs at about half its frame rate
; (lower RenderScale or the game's graphics settings if it stutters). 2 = the old 3D of version
; 1.0, one eye per frame in turn (depth shimmers when you move: not recommended).
Stereo3D = 1
; How sharp the picture is. The game renders at the resolution your headset asks for (set in
; SteamVR, the Meta Horizon app or Virtual Desktop: raise or lower it there), whatever the size of
; the game's window on your PC screen. 1 = exactly that; lower = faster but softer (0.8 is about
; 35% fewer pixels); above 1 = supersampling, for fast PCs (0.5 - 2; at most 4096 pixels a side
; and 16 megapixels whatever the headset asks for). 0 = render at the size of the game's window
; (blurry). The game must be in a window (Display mode: windowed), not fullscreen or borderless.
RenderScale = 1
; Menus and loading screens on a big screen fixed in the room in front of you (pause: the world
; stops and dims around it). 0 = across your whole view, following your head (old way)
MenuScreen = 1
; Its width, in degrees of your view (30 - 110), and how far away it is, in metres (0.8 - 10)
MenuScreenSize = 62
MenuScreenDistance = 2.4
; How bright the paused world stays around the menu screen (0 = dark room, 1 = as in the game)
MenuBackground = 0.22
; Cutscenes play around you: look anywhere with your head (the right stick turns too). Hold A or X
; for about 3 seconds to skip one. The game paints black bars above and below a cutscene; in a
; headset they hide the world over and under your eyes, so they are removed (1 = keep them)
CutsceneLetterbox = 0
; 0 = in a cutscene your hands stay on the controllers; 1 = they do what the cutscene animates
CutsceneArms = 0

[Cheats]
; These change your game for real: if the game saves (or autosaves) afterwards, the save keeps it.
; Unlock every power, upgrade, bone charm crafting, black market upgrade and weapon on every save you load
; (with full ammo once). 0 = play your save as it is
UnlockEverything = 1
; Mana never runs out: cast powers as often as you like
InfiniteMana = 1
; Ammo, gadgets and elixirs are not used up
InfiniteAmmo = 0
InfiniteHealth = 0

[Advanced]
; Write every controller button press to DishonoredVR.log (helps find out why a button does nothing)
LogControllerInput = 1
; Write DVR_heartbeat.txt in the game folder once a second (a detailed status, for troubleshooting)
WriteStatusFile = 0
; While the game itself stops for a moment (a load, a hitch), keep the headset showing the last picture, fixed in the
; room, instead of the headset's hourglass
KeepAliveFrames = 1
; When the headset's runtime stops VR on its own and does not resume it (an Air Link hiccup), start VR again after
; this many seconds (0 = wait for the runtime to resume it). Meta's runtime (Link / Air Link) only: with SteamVR or
; Virtual Desktop VR comes back when their app resumes it
NewSessionAfter = 5

